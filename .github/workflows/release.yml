    - name: Build Installer Binary Payload
      run: msbuild FoneCall.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="bin\Release\Installer"

    - name: Build Portable Binary Payload
      run: msbuild FoneCall.sln /p:Configuration=Release /p:Platform="Any CPU" /p:DefineConstants="PORTABLE" /p:OutputPath="bin\Release\Portable"

    - name: Stage Local Polyform License File
      run: |
        # Ensure directories exist
        New-Item -ItemType Directory -Path "FoneCall/bin/Release/Installer" -Force
        New-Item -ItemType Directory -Path "FoneCall/bin/Release/Portable" -Force
        
        # Copy your local Polyform LICENSE.md file into both output locations
        Copy-Item "INNO/LICENSE.md" -Destination "FoneCall/bin/Release/Installer/LICENSE.md" -Force
        Copy-Item "INNO/LICENSE.md" -Destination "FoneCall/bin/Release/Portable/LICENSE.md" -Force
      shell: powershell

    - name: Download Microsoft .NET 4.8.1 Runtime Web Installer
      run: |
        Invoke-WebRequest -Uri "https://microsoft.com" -OutFile "INNO/ndp481-webinstaller.exe"
      shell: powershell

    - name: Compile Inno Setup Installer via ISCC
      run: |
        cd INNO
        ISCC FoneCallGold_Spon.iss "/DappName=FoneCall" "/DreleaseFolder=$($Env:GITHUB_WORKSPACE)\FoneCall\bin\Release\Installer"
      shell: cmd

    - name: Assemble Packaging Matrix
      run: |
        # Setup clean staging paths
        New-Item -ItemType Directory -Path "dist/Option1" -Force
        New-Item -ItemType Directory -Path "dist/Option2" -Force
        New-Item -ItemType Directory -Path "dist/Option3" -Force
        New-Item -ItemType Directory -Path "dist/Option4" -Force

        # Option 1: Just the installer
        Copy-Item "INNO/Output/FoneCall_Setup.exe" -Destination "dist/Option1/"

        # Option 2: Installer + Runtime
        Copy-Item "INNO/Output/FoneCall_Setup.exe" -Destination "dist/Option2/"
        Copy-Item "INNO/ndp481-webinstaller.exe" -Destination "dist/Option2/"

        # Option 3: Portable Binaries 
        # Grabs the specific Portable compilation folder AND injects the db/log from INNO
        Copy-Item -Path "FoneCall/bin/Release/Portable/*" -Destination "dist/Option3/" -Recurse
        Copy-Item -Path "INNO/fonecall.db" -Destination "dist/Option3/" -ErrorAction SilentlyContinue
        Copy-Item -Path "INNO/fonecall.log" -Destination "dist/Option3/" -ErrorAction SilentlyContinue

        # Option 4: Portable Binaries + Runtime
        Copy-Item -Path "FoneCall/bin/Release/Portable/*" -Destination "dist/Option4/" -Recurse
        Copy-Item -Path "INNO/fonecall.db" -Destination "dist/Option4/" -ErrorAction SilentlyContinue
        Copy-Item -Path "INNO/fonecall.log" -Destination "dist/Option4/" -ErrorAction SilentlyContinue
        Copy-Item "INNO/ndp481-webinstaller.exe" -Destination "dist/Option4/"

        # Compress into your 4 zip outputs
        Compress-Archive -Path "dist/Option1/*" -DestinationPath "INNO/Output/FoneCall_Setup.zip" -Force
        Compress-Archive -Path "dist/Option2/*" -DestinationPath "INNO/Output/FoneCall_Setup+NDP481-Web.zip" -Force
        Compress-Archive -Path "dist/Option3/*" -DestinationPath "INNO/Output/FoneCall_Portable.zip" -Force
        Compress-Archive -Path "dist/Option4/*" -DestinationPath "INNO/Output/FoneCall_Portable+NDP481-Web.zip" -Force
      shell: powershell

    - name: Publish All 4 Formats to GitHub Draft Release
      uses: softprops/action-gh-release@v2
      with:
        draft: true  
        generate_release_notes: true
        body_path: INNO/ReleaseREADME.md  # <--- UPDATED SCRIPT PATH TARGET
        body: |
          ## ⚠️ Windows SmartScreen Notice
          Because FoneCall is open-source and distributed without an expensive corporate signing certificate, Windows Defender SmartScreen may show a warning when running the installer. 
          
          * **To run the application:** Click the **"More Info"** link on the blue window $\rightarrow$ Click **"Run Anyway"**.
          
          ### 📦 Package Formats Included:
          1. **FoneCall_Setup.zip** - The core standalone user-mode installer.
          2. **FoneCall_Setup+NDP481-Web.zip** - Installer bundled with the Microsoft .NET 4.8.1 runtime setup file.
          3. **FoneCall_Portable.zip** - Zero-install standalone folder structure.
          4. **FoneCall_Portable+NDP481-Web.zip** - Portable folder structure bundled with the Microsoft runtime.
          
          ---
        files: |
          INNO/Output/FoneCall_Setup.zip
          INNO/Output/FoneCall_Setup+NDP481-Web.zip
          INNO/Output/FoneCall_Portable.zip
          INNO/Output/FoneCall_Portable+NDP481-Web.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
