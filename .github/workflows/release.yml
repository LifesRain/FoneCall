name: Build and Release FoneCall Installer

on:
  push:
    tags:
      - 'v*' # Triggers whenever a tag starting with "v" is pushed
  workflow_dispatch: # Enables the manual "Run workflow" button in the GitHub Actions tab for testing

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Required for softprops/action-gh-release to create a draft release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup NuGet
      uses: nuget/setup-nuget@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # CRUCIAL: Fetches Dapper, SQLite, and Microsoft packages onto the clean GitHub runner
    - name: Restore NuGet Packages
      run: nuget restore FoneCall.sln

    - name: Build Installer Binary Payload (Release)
      run: msbuild FoneCall\FoneCall.csproj /t:Build /p:Configuration=Release /p:Platform="AnyCPU" /p:PostBuildEvent="" /p:SolutionDir="$($Env:GITHUB_WORKSPACE)\" /p:OutputPath="$($Env:GITHUB_WORKSPACE)\FoneCall\bin\Release\Installer\"

    - name: Build Portable Binary Payload (Release_Portable)
      run: msbuild FoneCall\FoneCall.csproj /t:Build /p:Configuration=Release_Portable /p:Platform="AnyCPU" /p:PostBuildEvent="" /p:SolutionDir="$($Env:GITHUB_WORKSPACE)\" /p:OutputPath="$($Env:GITHUB_WORKSPACE)\FoneCall\bin\Release\Portable\"

    - name: Stage Licenses, Database, and Log for Portable Payload
      run: |
        New-Item -ItemType Directory -Path "FoneCall/bin/Release/Portable" -Force
        
        Copy-Item "INNO/LICENSE.md" -Destination "FoneCall/bin/Release/Portable/LICENSE.md" -Force
        Copy-Item "THIRD-PARTY-NOTICES.txt" -Destination "FoneCall/bin/Release/Portable/THIRD-PARTY-NOTICES.txt" -Force
        Copy-Item "INNO/FoneCall.db" -Destination "FoneCall/bin/Release/Portable/FoneCall.db" -Force
        Copy-Item "INNO/FoneCall.log" -Destination "FoneCall/bin/Release/Portable/FoneCall.log" -Force
      shell: powershell

    - name: Download Microsoft .NET 4.8.1 Runtime Web Installer
      run: |
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2203304" -OutFile "INNO/ndp481-webinstaller.exe"
      shell: powershell

    - name: Compile Inno Setup Installer via ISCC
      run: |
        cd INNO
        set "ISCC_EXE=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
        if exist "%ProgramFiles(x86)%\Inno Setup 7\ISCC.exe" set "ISCC_EXE=%ProgramFiles(x86)%\Inno Setup 7\ISCC.exe"
        if exist "%ProgramFiles%\Inno Setup 7\ISCC.exe" set "ISCC_EXE=%ProgramFiles%\Inno Setup 7\ISCC.exe"
        "%ISCC_EXE%" FoneCallGold.iss "/DappName=FoneCall" "/DreleaseFolder=%GITHUB_WORKSPACE%\FoneCall\bin\Release\Installer"
      shell: cmd

    - name: Assemble Packaging Matrix
      run: |
        New-Item -ItemType Directory -Path "dist/Option1" -Force
        New-Item -ItemType Directory -Path "dist/Option2" -Force
        New-Item -ItemType Directory -Path "dist/Option3" -Force
        New-Item -ItemType Directory -Path "dist/Option4" -Force

        # Option 1: Standalone Gold Installer
        Copy-Item "INNO/Output/FoneCall_Setup.exe" -Destination "dist/Option1/"

        # Option 2: Gold Installer + .NET 4.8.1 Web Runtime
        Copy-Item "INNO/Output/FoneCall_Setup.exe" -Destination "dist/Option2/"
        Copy-Item "INNO/ndp481-webinstaller.exe" -Destination "dist/Option2/"

        # Option 3: Standalone Portable Folder (already includes Licenses, FoneCall.db, and FoneCall.log)
        Copy-Item -Path "FoneCall/bin/Release/Portable/*" -Destination "dist/Option3/" -Recurse
        Copy-Item -Path "INNO/fonecall.db" -Destination "dist/Option3/" -ErrorAction SilentlyContinue
        Copy-Item -Path "INNO/fonecall.log" -Destination "dist/Option3/" -ErrorAction SilentlyContinue

        # Option 4: Portable Folder + .NET 4.8.1 Web Runtime
        Copy-Item -Path "FoneCall/bin/Release/Portable/*" -Destination "dist/Option4/" -Recurse
        Copy-Item -Path "INNO/fonecall.db" -Destination "dist/Option4/" -ErrorAction SilentlyContinue
        Copy-Item -Path "INNO/fonecall.log" -Destination "dist/Option4/" -ErrorAction SilentlyContinue
        Copy-Item "INNO/ndp481-webinstaller.exe" -Destination "dist/Option4/"

        Compress-Archive -Path "dist/Option1/*" -DestinationPath "INNO/Output/FoneCall_Setup.zip" -Force
        Compress-Archive -Path "dist/Option2/*" -DestinationPath "INNO/Output/FoneCall_Setup+NDP481-Web.zip" -Force
        Compress-Archive -Path "dist/Option3/*" -DestinationPath "INNO/Output/Portable_Fonecall.zip" -Force
        Compress-Archive -Path "dist/Option4/*" -DestinationPath "INNO/Output/Portable_Fonecall+NDP481-Web.zip" -Force
      shell: powershell

    # Uploads the 4 ZIPs as downloadable workflow artifacts during manual test runs
    - name: Upload Test Build Artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v6
      with:
        name: fonecall-test-packages
        path: INNO/Output/*.zip

    # Only publishes a GitHub Draft Release when triggered by an actual v* tag push
    - name: Publish All 4 Formats to GitHub Draft Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: true  
        generate_release_notes: true 
        body: |
          Have you reviewed the [Installation Guide](https://github.com/LifesRain/FoneCall/blob/master/InstallGuide.md) which explains how to avoid the Windows SmartScreen?
        append_body: true 
        files: |
          INNO/Output/FoneCall_Setup.zip
          INNO/Output/FoneCall_Setup+NDP481-Web.zip
          INNO/Output/Portable_Fonecall.zip
          INNO/Output/Portable_Fonecall+NDP481-Web.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
